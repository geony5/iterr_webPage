<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>정책 페이지 이동</title>
    <meta http-equiv="refresh" content="0; url=/policy-cloudedpages/" />
    <script>
        (function () {
            var search = window.location.search || "";
            var hash = window.location.hash || "";
            var target = "/policy-cloudedpages/" + search + hash;
            window.location.replace(target);
        })();
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; display: grid; min-height: 100vh; place-items: center; background: #f8fafc; color: #1f2937; }
        .box { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; max-width: 520px; text-align: center; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <p>정책 페이지가 새 주소로 이동되었습니다.</p>
        <p><a href="/policy-cloudedpages/">여기를 눌러 이동하기</a></p>
    </div>
</body>
</html>
